services:
  # Using local Postgres/Redis when available; Docker images may be restricted in this environment.
  # Fallback: install local services or pull images manually.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helm
    ports: ["5432:5432"]
    volumes: [helm_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-postgres:
    profiles: ["temporal"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports: ["5433:5432"]
    volumes: [helm_temporal_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports: ["8233:8080"]

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ["../.env"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/helm
      REDIS_URL: redis://redis:6379
      BROWSER_WORKER_URL: http://browser-worker:8790
      HELM_ALLOW_TASK_DELETE: "1"
      HELM_TEST_MODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8787:8787"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ["../.env"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/helm
      REDIS_URL: redis://redis:6379
      BROWSER_WORKER_URL: http://browser-worker:8790
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/browser-worker.Dockerfile
    env_file: ["../.env"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/helm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8790:8790"]

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8787
    depends_on:
      api:
        condition: service_healthy
    ports: ["5173:5173"]

volumes:
  helm_pg:
  helm_temporal_pg:
